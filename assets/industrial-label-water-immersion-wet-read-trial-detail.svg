<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Record three observations</title><desc>Use the times required by the working process</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Record three observations</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Use the times required by the working process</text><rect x="58" y="191" width="682" height="62" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="399.0" y="232" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">1   Before exposure</text><line x1="397" y1="259" x2="397" y2="288" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><rect x="58" y="296" width="682" height="62" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="399.0" y="337" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">2   At retrieval, while wet</text><line x1="397" y1="364" x2="397" y2="394" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><rect x="58" y="402" width="682" height="62" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><text x="399.0" y="443" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">3   After drying, if required</text><text x="399" y="533" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Check print, attachment and the required read.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>