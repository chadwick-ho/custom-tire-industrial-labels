<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Keep the clear area</title><desc>Measure the complete footprint, not just the code</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Keep the clear area</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Measure the complete footprint, not just the code</text><rect x="97" y="192" width="605" height="285" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><rect x="139" y="226" width="521" height="216" rx="2" fill="#ffffff" stroke="#17685d" stroke-width="3"/><rect x="200" y="273" width="399" height="123" rx="2" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="399" y="341" fill="#162c42" font-size="33" text-anchor="middle" font-weight="600">Symbol area</text><line x1="485" y1="451" x2="485" y2="414" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><text x="400" y="529" fill="#17685d" font-size="30" text-anchor="middle" font-weight="600">Quiet zone surrounds the symbol.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>