<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Record the operation before the proof</title><desc>Conceptual asset history, no measured colour result</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Record the operation before the proof</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Conceptual asset history, no measured colour result</text><rect x="75" y="177" width="290" height="301" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="98" y="224" fill="#162c42" font-size="29" text-anchor="start" font-weight="600">SOURCE RECORD</text><text x="98" y="288" fill="#162c42" font-size="29" text-anchor="start" font-weight="600">Original asset</text><text x="98" y="340" fill="#162c42" font-size="27" text-anchor="start" font-weight="600">Profile / unknown</text><text x="98" y="414" fill="#162c42" font-size="26" text-anchor="start" font-weight="600">Intended reference</text><line x1="378" y1="332" x2="424" y2="332" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><rect x="439" y="177" width="286" height="301" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="460" y="224" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">CHANGE RECORD</text><text x="460" y="288" fill="#162c42" font-size="26" text-anchor="start" font-weight="600">Assign or convert?</text><text x="460" y="340" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">Source → target</text><text x="460" y="414" fill="#162c42" font-size="29" text-anchor="start" font-weight="600">Returned proof</text><text x="400" y="539" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">A destination name alone is not the history.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>