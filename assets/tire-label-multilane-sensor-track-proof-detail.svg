<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Read the track as a sequence</title><desc>The same roll can look different across its width</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Read the track as a sequence</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">The same roll can look different across its width</text><text x="62" y="183" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">Through the first lane</text><rect x="62" y="207" width="674" height="62" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><rect x="84" y="207" width="173" height="62" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="303" y="207" width="173" height="62" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="522" y="207" width="173" height="62" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="62" y="362" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">Between the lanes</text><rect x="62" y="385" width="674" height="62" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><text x="400" y="535" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">Confirm the observed repeat in the actual printer.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>