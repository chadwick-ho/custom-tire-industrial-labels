<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Protocol is one part of the brief</title><desc>Conceptual scopes; not frequency ranges</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Protocol is one part of the brief</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Conceptual scopes; not frequency ranges</text><rect x="90" y="171" width="620" height="86" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="112" y="224" fill="#162c42" font-size="32" text-anchor="start" font-weight="600">Protocol and supported features</text><rect x="90" y="281" width="514" height="86" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="112" y="334" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">Offered tag / reader evidence</text><rect x="90" y="391" width="568" height="86" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><text x="112" y="444" fill="#162c42" font-size="29" text-anchor="start" font-weight="600">Actual site operating requirement</text><text x="400" y="533" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">The owner must establish the applicable overlap.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>