<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Contrast-ratio opacity arithmetic</title><desc>Fictional readings; no acceptance limit</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Contrast-ratio opacity arithmetic</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Fictional readings; no acceptance limit</text><text x="73" y="199" fill="#162c42" font-size="32" text-anchor="start" font-weight="600">Y over black backing = 80</text><text x="73" y="253" fill="#162c42" font-size="32" text-anchor="start" font-weight="600">Y over white backing = 100</text><line x1="400" y1="282" x2="400" y2="326" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><rect x="93" y="345" width="614" height="85" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="400.0" y="397.5" fill="#162c42" font-size="36" text-anchor="middle" font-weight="600">80 / 100 × 100 = 80%</text><text x="400" y="491" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Then review the complete applied cover-up</text><text x="400" y="536" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">over the actual authorized obsolete graphic.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>