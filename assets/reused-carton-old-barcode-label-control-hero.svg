<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><rect width="1200" height="400" fill="#eef3f2"/><rect width="1200" height="20" fill="#ed6a2c"/><text x="35" y="75" font-family="Arial" font-size="30" font-weight="bold" fill="#173349">REUSED CARTON LABEL CHECK</text><text x="35" y="115" font-family="Arial" font-size="23" fill="#405b68">Make the current shipment easy to identify</text><rect x="35" y="170" width="260" height="125" rx="14" fill="white"/><text x="165" y="238" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="18" fill="#173349">FIND OLD CODES</text><rect x="325" y="170" width="260" height="125" rx="14" fill="white"/><text x="455" y="238" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="18" fill="#173349">REMOVE OR COVER</text><rect x="615" y="170" width="260" height="125" rx="14" fill="white"/><text x="745" y="238" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="18" fill="#173349">APPLY CURRENT</text><rect x="905" y="170" width="260" height="125" rx="14" fill="white"/><text x="1035" y="238" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="18" fill="#173349">CHECK AGAIN</text><text x="35" y="355" font-family="Arial" font-size="18" fill="#405b68">Illustrative workflow: follow the carrier and product owner requirements.</text></svg>