<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Read the humidity test scope</title><desc>Conceptual temperature profiles; not test data</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Read the humidity test scope</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Conceptual temperature profiles; not test data</text><text x="98" y="178" fill="#162c42" font-size="29" text-anchor="start" font-weight="600">Steady state: noncondensing scope</text><line x1="90" y1="320" x2="710" y2="320" stroke="#234c69" stroke-width="3"/><line x1="90" y1="320" x2="90" y2="210" stroke="#234c69" stroke-width="3"/><line x1="111" y1="248" x2="688" y2="248" stroke="#17685d" stroke-width="5"/><text x="98" y="374" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">Cyclic: condensation generally expected</text><line x1="90" y1="514" x2="710" y2="514" stroke="#234c69" stroke-width="3"/><line x1="90" y1="514" x2="90" y2="404" stroke="#234c69" stroke-width="3"/><path d="M 111 477 L 196 421 L 282 421 L 367 477 L 453 477 L 539 421 L 624 421 L 688 477" fill="none" stroke="#994620" stroke-width="5"/><text x="400" y="551" fill="#162c42" font-size="26" text-anchor="middle" font-weight="600">Exposure hours alone do not identify the method.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>