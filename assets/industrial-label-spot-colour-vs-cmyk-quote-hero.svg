<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650"><rect width="800" height="650" fill="#edf3f4"/><rect width="800" height="12" fill="#dd743e"/><g font-family="Arial,sans-serif"><text x="30" y="60" fill="#15394a" font-size="29" font-weight="bold">COLOUR TARGET AND PRINT MODE DIFFER</text><text x="40" y="130" fill="#15394a" font-size="26" font-weight="bold">SPOT-INK CONCEPT</text><rect x="60" y="185" width="290" height="170" rx="6" fill="#497796"/><text x="40" y="425" fill="#15394a" font-size="25" font-weight="normal">One specified ink route</text><text x="440" y="130" fill="#15394a" font-size="26" font-weight="bold">PROCESS CONCEPT</text><rect x="440" y="185" width="65" height="170" rx="6" fill="#4bafc6"/><text x="460" y="395" fill="#15394a" font-size="27" font-weight="bold">C</text><rect x="520" y="185" width="65" height="170" rx="6" fill="#c16ba0"/><text x="540" y="395" fill="#15394a" font-size="27" font-weight="bold">M</text><rect x="600" y="185" width="65" height="170" rx="6" fill="#d5bb51"/><text x="620" y="395" fill="#15394a" font-size="27" font-weight="bold">Y</text><rect x="680" y="185" width="65" height="170" rx="6" fill="#273b42"/><text x="700" y="395" fill="#15394a" font-size="27" font-weight="bold">K</text><text x="40" y="525" fill="#15394a" font-size="25" font-weight="normal">A common target does not specify the same ink mode.</text><text x="30" y="616" fill="#15394a" font-size="23" font-weight="normal">Colours are illustrative; no Pantone match is simulated.</text></g></svg>