<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Review the finished construction</title><desc>Conceptual layers; no compliance claim</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Review the finished construction</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Conceptual layers; no compliance claim</text><rect x="90" y="177" width="620" height="40" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="112" y="208" fill="#162c42" font-size="27" text-anchor="start" font-weight="600">Protective layer, if specified</text><rect x="90" y="228" width="620" height="52" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="112" y="264" fill="#162c42" font-size="29" text-anchor="start" font-weight="600">Transferred print / other ink</text><rect x="90" y="291" width="620" height="61" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><text x="112" y="332" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">Face material</text><rect x="90" y="363" width="620" height="55" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><text x="112" y="401" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">Adhesive</text><text x="400" y="489" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Identify the evidence for each supplied layer.</text><text x="400" y="535" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">Blank stock alone does not identify the print.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y