<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Same digits, different mass</title><desc>Illustrative arithmetic; no weighing result</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Same digits, different mass</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Illustrative arithmetic; no weighing result</text><rect x="80" y="180" width="640" height="99" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="400.0" y="239.5" fill="#162c42" font-size="38" text-anchor="middle" font-weight="600">MAGNITUDE: 012345</text><path d="M 400 284 L 400 315 L 220 315 L 220 348" fill="none" stroke="#17685d" stroke-width="4"/><path d="M 400 315 L 580 315 L 580 348" fill="none" stroke="#17685d" stroke-width="4"/><text x="105" y="395" fill="#162c42" font-size="35" text-anchor="start" font-weight="600">AI 3102</text><text x="464" y="395" fill="#162c42" font-size="35" text-anchor="start" font-weight="600">AI 3103</text><text x="105" y="466" fill="#162c42" font-size="36" text-anchor="start" font-weight="600">123.45 kg</text><text x="464" y="466" fill="#162c42" font-size="36" text-anchor="start" font-weight="600">12.345 kg</text><text x="400" y="540" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Check the parsed amount, not only the digits.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>