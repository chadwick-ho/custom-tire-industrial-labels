<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Release three separate choices</title><desc>Conceptual reader contract</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Release three separate choices</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Conceptual reader contract</text><text x="107" y="215" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">Stage</text><text x="368" y="215" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">Decision</text><rect x="78" y="239" width="644" height="85" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="78" y="340" width="644" height="85" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><rect x="78" y="441" width="644" height="85" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><text x="107" y="292" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">Generate</text><text x="368" y="292" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">Include check character?</text><text x="107" y="393" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">Verify</text><text x="368" y="393" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">Check at the reader?</text><text x="107" y="494" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">Transmit</text><text x="368" y="494" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">Send it to the host?</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill