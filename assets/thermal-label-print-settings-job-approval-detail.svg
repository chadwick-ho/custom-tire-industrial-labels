<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Compare two job paths</title><desc>Check what each sends to the printer</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Compare two job paths</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Check what each sends to the printer</text><rect x="43" y="212" width="210" height="83" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="148" y="263" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">Test utility</text><rect x="295" y="212" width="210" height="83" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="400" y="263" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">Local path</text><rect x="547" y="212" width="210" height="83" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="652" y="263" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">Sample A</text><line x1="255" y1="254" x2="289" y2="254" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><line x1="507" y1="254" x2="541" y2="254" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><rect x="43" y="363" width="210" height="83" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="148" y="414" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">Production app</text><rect x="295" y="363" width="210" height="83" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="400" y="414" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">Job / driver</text><rect x="547" y="363" width="210" height="83" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="652" y="414" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">Sample B</text><line x1="255" y1="405" x2="289" y2="405" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><line x1="507" y1="405" x2="541" y2="405" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><text x="400" y="519" fill="#17685d" font-size="27" text-anchor="middle" font-weight="600">Same printer and supplies in this comparison</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>