<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Two changes need different approval</title><desc>Conceptual identity routes</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Two changes need different approval</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Conceptual identity routes</text><rect x="70" y="172" width="660" height="69" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="400.0" y="216.5" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">Approved item and its assigned GTIN</text><line x1="400" y1="255" x2="222" y2="309" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><line x1="400" y1="255" x2="578" y2="309" stroke="#994620" stroke-width="4" marker-end="url(#arrow)"/><rect x="55" y="325" width="333" height="151" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="221" y="374" fill="#162c42" font-size="33" text-anchor="middle" font-weight="600">Same item</text><text x="221" y="419" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">Required filling</text><text x="221" y="457" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">rule</text><rect x="412" y="325" width="333" height="151" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><text x="578" y="374" fill="#162c42" font-size="33" text-anchor="middle" font-weight="600">New case</text><text x="578" y="419" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Identifier owner’s</text><text x="578" y="457" fill="#162c42" font-size="28" text-anchor="middle" font