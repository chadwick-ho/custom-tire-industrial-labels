<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Static shear geometry</title><desc>A bonded strip under an in-plane load</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Static shear geometry</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">A bonded strip under an in-plane load</text><rect x="163" y="182" width="260" height="312" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><text x="204" y="227" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">Test panel</text><rect x="338" y="247" width="84" height="142" rx="2" fill="#f9e1d3" stroke="#994620" stroke-width="3"/><rect x="400" y="256" width="86" height="221" rx="8" fill="#cbece1" stroke="#17685d" stroke-width="3"/><line x1="485" y1="293" x2="549" y2="293" stroke="#234c69" stroke-width="4"/><text x="567" y="302" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">Bond area</text><line x1="446" y1="477" x2="446" y2="527" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><text x="485" y="514" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">Sustained load</text><text x="69" y="534" fill="#162c42" font-size="27" text-anchor="start" font-weight="600">Force along panel</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>