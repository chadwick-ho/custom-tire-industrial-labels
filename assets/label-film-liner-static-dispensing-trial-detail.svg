<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Locate the observation</title><desc>Record where and when the change appears</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Locate the observation</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Record where and when the change appears</text><line x1="67" y1="259" x2="444" y2="259" stroke="#234c69" stroke-width="6"/><path d="M444 259 L682 418" fill="none" stroke="#234c69" stroke-width="6"/><line x1="447" y1="259" x2="730" y2="259" stroke="#17685d" stroke-width="5" marker-end="url(#arrow)"/><text x="203" y="225" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">Before peel</text><text x="615" y="222" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">Transfer</text><circle cx="444" cy="259" r="12" fill="#994620" stroke="#234c69" stroke-width="3"/><text x="586" y="466" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">Spent web</text><text x="400" y="529" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Keep timing and material with the observation.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>