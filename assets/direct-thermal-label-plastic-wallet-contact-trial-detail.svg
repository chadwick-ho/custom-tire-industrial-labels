<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Keep a matched control</title><desc>Conceptual inspection after the agreed contact period</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Keep a matched control</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Conceptual inspection after the agreed contact period</text><rect x="84" y="229" width="278" height="225" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><rect x="439" y="229" width="278" height="225" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="461" y="253" width="234" height="176" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="223" y="312" fill="#162c42" font-size="33" text-anchor="middle" font-weight="600">Control</text><text x="578" y="312" fill="#162c42" font-size="33" text-anchor="middle" font-weight="600">Contact</text><line x1="120" y1="362" x2="326" y2="362" stroke="#17685d" stroke-width="4"/><line x1="484" y1="362" x2="671" y2="362" stroke="#17685d" stroke-width="4"/><text x="400" y="511" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Compare print and unprinted background.</text><text x="400" y="552" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Then read through the installed holder.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>