<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>One character changes the path</title><desc>Illustrative strings, not live URLs</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">One character changes the path</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Illustrative strings, not live URLs</text><text x="47" y="195" fill="#17685d" font-size="30" text-anchor="start" font-weight="600">Encoded slash within the segment</text><rect x="52" y="225" width="290" height="62" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><text x="197.0" y="266" fill="#162c42" font-size="34" text-anchor="middle" font-weight="600">/asset/</text><rect x="347" y="225" width="394" height="62" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="544.0" y="266" fill="#162c42" font-size="34" text-anchor="middle" font-weight="600">A%2FB</text><text x="47" y="364" fill="#994620" font-size="30" text-anchor="start" font-weight="600">Literal slash separates segments</text><rect x="52" y="393" width="290" height="62" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><text x="197.0" y="434" fill="#162c42" font-size="34" text-anchor="middle" font-weight="600">/asset/</text><rect x="347" y="393" width="111" height="62" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="402.5" y="434" fill="#162c42" font-size="34" text-anchor="middle" font-weight="600">A</text><rect x="465" y="393" width="110" height="62" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><text x="520.0" y="434" fill="#162c42" font-size="34" text-anchor="middle" font-weight="600">/</text><rect x="582" y="393" width="159" height="62" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="661.5" y="434" fill="#162c42" font-size="34" text-anchor="middle" font-weight="600">B</text><text x="48" y="519" fill="#162c42" font-size="29" text-anchor="start" font-weight="600">The application owner checks the route.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>