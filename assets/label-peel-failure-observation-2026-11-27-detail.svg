<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Keep three distinct report fields</title><desc>Blank editorial example; no invented peel results</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Keep three distinct report fields</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Blank editorial example; no invented peel results</text><rect x="65" y="190" width="670" height="254" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><rect x="65" y="190" width="670" height="75" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><line x1="269" y1="190" x2="269" y2="444" stroke="#234c69" stroke-width="3"/><line x1="505" y1="190" x2="505" y2="444" stroke="#234c69" stroke-width="3"/><text x="166" y="238" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">FORCE</text><text x="387" y="238" fill="#162c42" font-size="25" text-anchor="middle" font-weight="600">OBSERVATION</text><text x="619" y="238" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">RULE</text><text x="166" y="347" fill="#162c42" font-size="24" text-anchor="middle" font-weight="600">Value + units</text><text x="387" y="347" fill="#162c42" font-size="23" text-anchor="middle" font-weight="600">What separated?</text><text x="619" y="347" fill="#162c42" font-size="23" text-anchor="middle" font-weight="600">Owner basis</text><text x="400" y="514" fill="#162c42" font-size="24" text-anchor="middle" font-weight="600">Neither a large force nor a clean peel is a universal pass.</text><text x="400" y="548" fill="#162c42" font-size="25" text-anchor="middle" font-weight="600">Retain method, specimen and responsible interpretation.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>