<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>An underscore can be an indicator</title><desc>Illustrative ZPL field fragment only</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">An underscore can be an indicator</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Illustrative ZPL field fragment only</text><text x="75" y="199" fill="#162c42" font-size="29" text-anchor="start" font-weight="600">Intended literal source</text><rect x="75" y="218" width="650" height="69" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="400.0" y="262.5" fill="#162c42" font-size="35" text-anchor="middle" font-weight="600">_41</text><text x="75" y="333" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">With default ^FH interpretation</text><rect x="75" y="354" width="245" height="72" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><text x="197.5" y="400.0" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">_41  →  A</text><rect x="350" y="354" width="375" height="72" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="537.5" y="400.0" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">_5F41  →  _41</text><text x="400" y="491" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">Have the integration owner verify the route.</text><text x="400" y="531" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Avoid escaping the same value twice.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>