<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Same values, different interpretation</title><desc>Colour swatches are schematic, not ICC simulations</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Same values, different interpretation</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Colour swatches are schematic, not ICC simulations</text><rect x="155" y="170" width="490" height="75" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="400.0" y="217.5" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">UNCHANGED COLOUR VALUES</text><line x1="275" y1="264" x2="215" y2="313" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><line x1="525" y1="264" x2="585" y2="313" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><rect x="92" y="329" width="257" height="107" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="451" y="329" width="257" height="107" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="220" y="392" fill="#162c42" font-size="36" text-anchor="middle" font-weight="600">Profile A</text><text x="580" y="392" fill="#162c42" font-size="36" text-anchor="middle" font-weight="600">Profile B</text><text x="400" y="502" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">Assignment changes interpretation.</text><text x="400" y="547" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">It does not change the existing channel values.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>