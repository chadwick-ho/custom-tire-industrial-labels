<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680"><rect width="800" height="680" fill="#eff4f4"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="800" height="14" rx="10" fill="#e86a30"/><text x="36" y="65" font-size="30" fill="#17384b" font-weight="bold">WRITE STATUS BESIDE EVERY DATE</text><rect x="30" y="105" width="740" height="90" rx="10" fill="white"/><text x="48" y="135" font-size="28" fill="#17384b" font-weight="bold">REQUIRED</text><text x="48" y="171" font-size="25" fill="#17384b" font-weight="normal">Usable date, local time and location</text><rect x="30" y="215" width="740" height="90" rx="10" fill="white"/><text x="48" y="245" font-size="28" fill="#17384b" font-weight="bold">CONFIRMED</text><text x="48" y="281" font-size="25" fill="#17384b" font-weight="normal">Owner + dated record + conditions</text><rect x="30" y="325" width="740" height="90" rx="10" fill="white"/><text x="48" y="355" font-size="28" fill="#17384b" font-weight="bold">PENDING</text><text x="48" y="391" font-size="25" fill="#17384b" font-weight="normal">Missing approval, route or specification</text><rect x="30" y="435" width="740" height="90" rx="10" fill="white"/><text x="48" y="465" font-size="28" fill="#17384b" font-weight="bold">REPLAN TRIGGER</text><text x="48" y="501" font-size="25" fill="#17384b" font-weight="normal">When the packing owner must decide</text><text x="36" y="580" font-size="26" fill="#17384b" font-weight="normal">Requested dates remain requests until assessed.</text><text x="36" y="640" font-size="24" fill="#17384b" font-weight="normal">Illustrative planning aid; agree order-specific terms.</text></g></svg>