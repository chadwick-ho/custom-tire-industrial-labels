<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Same rate, different web travel</title><desc>Illustrative demand of 100 labels per minute</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Same rate, different web travel</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Illustrative demand of 100 labels per minute</text><text x="51" y="190" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">90 mm pitch</text><rect x="53" y="216" width="382" height="70" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="245" y="263" fill="#17685d" font-size="34" text-anchor="middle" font-weight="600">9 m/min</text><text x="51" y="362" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">120 mm pitch</text><rect x="53" y="388" width="510" height="70" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="306" y="435" fill="#162c42" font-size="34" text-anchor="middle" font-weight="600">12 m/min</text><text x="400" y="535" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Record actual transfers and stops in the trial.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>