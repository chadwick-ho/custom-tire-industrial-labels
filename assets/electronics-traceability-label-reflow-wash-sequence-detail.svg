<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Keep the same specimen identity</title><desc>Illustrative checkpoints; no process results</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Keep the same specimen identity</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Illustrative checkpoints; no process results</text><line x1="155" y1="270" x2="655" y2="270" stroke="#17685d" stroke-width="5" marker-end="url(#arrow)"/><circle cx="159" cy="270" r="18" fill="#cbece1" stroke="#234c69" stroke-width="3"/><circle cx="400" cy="270" r="18" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><circle cx="641" cy="270" r="18" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="159" y="333" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Before heat</text><text x="400" y="333" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">After heat</text><text x="641" y="333" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">After wash</text><rect x="139" y="399" width="523" height="83" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="400.5" y="450.5" fill="#162c42" font-size="35" text-anchor="middle" font-weight="600">Attachment · Text · Code</text><text x="400" y="535" fill="#162c42" font-size="26" text-anchor="middle" font-weight="600">Record the label and board reference at each step.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TE