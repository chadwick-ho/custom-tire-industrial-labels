<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Compare the limiting dimensions</title><desc>Fictional width example; no tolerance promise</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Compare the limiting dimensions</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Fictional width example; no tolerance promise</text><rect x="90" y="188" width="620" height="72" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><text x="400.0" y="234.0" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">Minimum recess: 49.7 mm</text><text x="400" y="304" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">minus</text><rect x="90" y="331" width="620" height="72" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="400.0" y="377.0" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">Maximum label: 49.2 mm</text><line x1="400" y1="414" x2="400" y2="447" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><text x="400" y="488" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">0.5 mm total remaining space</text><text x="400" y="537" fill="#162c42" font-size="25" text-anchor="middle" font-weight="600">Centering and required clearance still need review.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>