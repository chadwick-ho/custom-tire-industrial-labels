<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650"><rect width="800" height="650" fill="#eef3f4"/><rect width="800" height="12" fill="#df6e34"/><g font-family="Arial, sans-serif"><text x="30" y="62" font-size="29" fill="#17394a" font-weight="bold">SAMPLE QUOTE: ITEMIZE THE SCOPE</text><text x="35" y="117" font-size="26" fill="#17394a" font-weight="bold">Cost line</text><text x="330" y="117" font-size="26" fill="#17394a" font-weight="bold">Confirm what is delivered</text><path d="M30 150 L770 150" fill="none" stroke="#b7c8ce" stroke-width="2"/><text x="35" y="190" font-size="26" fill="#17394a" font-weight="normal">Preparation</text><text x="330" y="190" font-size="24" fill="#17394a" font-weight="normal">Approved files and changes</text><path d="M30 240 L770 240" fill="none" stroke="#b7c8ce" stroke-width="2"/><text x="35" y="280" font-size="26" fill="#17394a" font-weight="normal">Printed sample</text><text x="330" y="280" font-size="24" fill="#17394a" font-weight="normal">Construction, size, quantity</text><path d="M30 330 L770 330" fill="none" stroke="#b7c8ce" stroke-width="2"/><text x="35" y="370" font-size="26" fill="#17394a" font-weight="normal">Trial format</text><text x="330" y="370" font-size="24" fill="#17394a" font-weight="normal">Sheets or specified roll</text><path d="M30 420 L770 420" fill="none" stroke="#b7c8ce" stroke-width="2"/><text x="35" y="460" font-size="26" fill="#17394a" font-weight="normal">Shipping</text><text x="330" y="460" font-size="24" fill="#17394a" font-weight="normal">Destination and included scope</text><text x="35" y="555" font-size="25" fill="#17394a" font-weight="normal">Any later-order credit: obtain explicit conditions.</text><text x="30" y="614" font-size="23" fill="#17394a" font-weight="normal">Illustrative only; confirm the actual order requirements.</text></g></svg>