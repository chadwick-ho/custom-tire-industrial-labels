<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Keep the pairing with each observation</title><desc>Editorial review record; no filling test prescribed</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Keep the pairing with each observation</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Editorial review record; no filling test prescribed</text><rect x="72" y="177" width="656" height="60" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="400.0" y="217.0" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">CONTAINER + CONTENTS + LABEL</text><line x1="400" y1="248" x2="400" y2="283" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><rect x="72" y="300" width="313" height="160" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="415" y="300" width="313" height="160" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="228" y="350" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">Initial state</text><text x="228" y="402" fill="#162c42" font-size="25" text-anchor="middle" font-weight="600">Identified sample</text><text x="571" y="350" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">Follow-up</text><text x="571" y="402" fill="#162c42" font-size="25" text-anchor="middle" font-weight="600">Agreed conditions</text><text x="400" y="519" fill="#162c42" font-size="26" text-anchor="middle" font-weight="600">Attachment and readable information: check both.</text><text x="400" y="550" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">The packaging owner defines the evaluation.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>