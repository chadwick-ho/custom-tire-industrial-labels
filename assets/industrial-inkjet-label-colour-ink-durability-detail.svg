<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650"><rect width="800" height="650" fill="#edf3f4"/><rect width="800" height="12" fill="#dc753f"/><g font-family="Arial,sans-serif"><text x="30" y="60" fill="#15394a" font-size="29" font-weight="bold">IDENTIFY THE COMPLETE PRINTED SYSTEM</text><rect x="40" y="130" width="720" height="90" rx="5" fill="#fff"/><text x="60" y="185" fill="#15394a" font-size="29" font-weight="bold">Actual ink channels + actual artwork</text><rect x="40" y="235" width="720" height="55" rx="5" fill="#a9cbd0"/><text x="60" y="272" fill="#15394a" font-size="25" font-weight="normal">Specified print-receptive coating</text><rect x="40" y="305" width="720" height="70" rx="5" fill="#fff"/><text x="60" y="350" fill="#15394a" font-size="27" font-weight="normal">Face stock</text><rect x="40" y="390" width="720" height="35" rx="5" fill="#e7b391"/><rect x="40" y="440" width="720" height="60" rx="5" fill="#a9cbd0"/><text x="60" y="480" fill="#15394a" font-size="25" font-weight="normal">Adhesive and liner: separate identities</text><text x="40" y="555" fill="#15394a" font-size="24" font-weight="normal">Assess print, attachment and data as separate outcomes.</text><text x="30" y="615" fill="#15394a" font-size="23" font-weight="normal">Original schematic; no test result or approval implied.</text></g></svg>