<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>A near-limit measurement needs a rule</title><desc>Fictional dimensions; no pass or fail assigned</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">A near-limit measurement needs a rule</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Fictional dimensions; no pass or fail assigned</text><line x1="96" y1="355" x2="716" y2="355" stroke="#234c69" stroke-width="3" marker-end="url(#arrow)"/><line x1="511" y1="188" x2="511" y2="207" stroke="#994620" stroke-width="4" stroke-dasharray="9 8"/><line x1="511" y1="260" x2="511" y2="447" stroke="#994620" stroke-width="4" stroke-dasharray="9 8"/><text x="511" y="177" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">Upper limit: 50.00 mm</text><line x1="202" y1="286" x2="642" y2="286" stroke="#17685d" stroke-width="8"/><line x1="202" y1="265" x2="202" y2="306" stroke="#17685d" stroke-width="4"/><line x1="642" y1="265" x2="642" y2="306" stroke="#17685d" stroke-width="4"/><circle cx="422" cy="286" r="12" fill="#234c69" stroke="#234c69" stroke-width="3"/><text x="422" y="241" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">49.96 ± 0.08 mm</text><text x="202" y="404" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">49.88</text><text x="642" y="404" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">50.04</text><text x="400" y="495" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Expanded uncertainty is not extra tolerance.</text><text x="400" y="540" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">The agreed decision rule governs disposition.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>