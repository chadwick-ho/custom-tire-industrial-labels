<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Fluid changes the bonding route</title><desc>Concept only; require the actual supplier instructions</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Fluid changes the bonding route</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Concept only; require the actual supplier instructions</text><rect x="86" y="204" width="344" height="48" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="86" y="252" width="344" height="28" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><rect x="86" y="280" width="344" height="37" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><rect x="86" y="317" width="344" height="64" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><text x="480" y="238" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">Label face</text><text x="480" y="277" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">Adhesive</text><text x="480" y="315" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">Added fluid?</text><text x="480" y="365" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">Actual panel</text><line x1="438" y1="299" x2="466" y2="299" stroke="#17685d" stroke-width="4"/><text x="400" y="445" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Cleaning and wet bonding are different steps.</text><text x="400" y="512" fill="#162c42" font-size="26" text-anchor="middle" font-weight="600">Do not add a process the construction has not qualified.</text><line x1="35