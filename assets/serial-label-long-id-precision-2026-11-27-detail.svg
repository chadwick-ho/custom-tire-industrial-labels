<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Formatting cannot restore a lost digit</title><desc>Conceptual handoff, not an observed print job</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Formatting cannot restore a lost digit</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Conceptual handoff, not an observed print job</text><rect x="83" y="179" width="634" height="72" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="400.0" y="225.0" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">AUTHORITATIVE TEXT STRING</text><line x1="400" y1="261" x2="400" y2="301" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><rect x="83" y="314" width="634" height="72" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="400.0" y="360.0" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">RAW EXPORTED FIELD</text><line x1="400" y1="397" x2="400" y2="435" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><rect x="83" y="448" width="634" height="72" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="400.0" y="494.0" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">READABLE + DECODED + LOOKUP</text><text x="400" y="549" fill="#162c42" font-size="24" text-anchor="middle" font-weight="600">Compare with the original authority, not a damaged copy.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>