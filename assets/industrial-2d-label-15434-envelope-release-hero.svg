<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>The carrier is not the message format</title><desc>Concept only; not an encoded or approved payload</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">The carrier is not the message format</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Concept only; not an encoded or approved payload</text><rect x="58" y="194" width="684" height="245" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><rect x="83" y="244" width="143" height="125" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><text x="154.5" y="316.5" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">HEADER</text><rect x="236" y="244" width="329" height="125" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="400.5" y="316.5" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">APPROVED FIELDS</text><rect x="575" y="244" width="143" height="125" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><text x="646.5" y="316.5" fill="#162c42" font-size="26" text-anchor="middle" font-weight="600">TRAILER</text><line x1="82" y1="418" x2="716" y2="418" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><text x="400" y="485" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Receiver specification defines these boundaries.</text><text x="400" y="538" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">A neat symbol preview does not prove parsing.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>