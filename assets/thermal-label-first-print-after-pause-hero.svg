<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>First print after a pause</title><desc>Inspect a representative production transition</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">First print after a pause</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Inspect a representative production transition</text><rect x="57" y="229" width="686" height="162" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><rect x="89" y="255" width="253" height="109" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><text x="215.5" y="319.5" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">First print</text><rect x="453" y="255" width="253" height="109" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="579.5" y="319.5" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">Later print</text><line x1="215" y1="201" x2="215" y2="238" stroke="#994620" stroke-width="4" marker-end="url(#arrow)"/><text x="215" y="177" fill="#994620" font-size="31" text-anchor="middle" font-weight="600">Resume event</text><line x1="96" y1="465" x2="707" y2="465" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><text x="400" y="524" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">Compare prints from the same job.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>