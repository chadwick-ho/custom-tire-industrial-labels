<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650"><rect width="800" height="650" fill="#eef3f4"/><rect width="800" height="12" fill="#dd7138"/><g font-family="Arial, sans-serif"><text x="30" y="62" fill="#15394a" font-size="29" font-weight="bold">KEEP TWO PERFORMANCE QUESTIONS</text><text x="40" y="145" fill="#15394a" font-size="28" font-weight="bold">QUESTION 1</text><rect x="40" y="180" width="720" height="100" rx="7" fill="#ffffff"/><text x="65" y="225" fill="#15394a" font-size="25" font-weight="normal">Does the label meet the product-surface task?</text><text x="40" y="355" fill="#15394a" font-size="28" font-weight="bold">QUESTION 2</text><rect x="40" y="390" width="720" height="100" rx="7" fill="#ffffff"/><text x="65" y="435" fill="#15394a" font-size="24" font-weight="normal">Does the supplied roll suit handling and equipment?</text><text x="40" y="555" fill="#15394a" font-size="25" font-weight="normal">One answer does not automatically establish the other.</text><text x="30" y="614" fill="#15394a" font-size="24" font-weight="normal">Schematic only; confirm the project specification.</text></g></svg>