<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Add coverage at one location</title><desc>Fictional arithmetic; not a production limit</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Add coverage at one location</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Fictional arithmetic; not a production limit</text><rect x="63" y="193" width="152" height="87" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="139.0" y="246.5" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">C 60%</text><rect x="237" y="193" width="152" height="87" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><text x="313.0" y="246.5" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">M 50%</text><rect x="411" y="193" width="152" height="87" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="487.0" y="246.5" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">Y 50%</text><rect x="585" y="193" width="152" height="87" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><text x="661.0" y="246.5" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">K 100%</text><line x1="400" y1="302" x2="400" y2="350" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><rect x="107" y="369" width="586" height="91" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="400.0" y="424.5" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">60 + 50 + 50 + 100 = 260%</text><text x="400" y="522" fill="#162c42" font-size="28" text-anchor="middle" font-