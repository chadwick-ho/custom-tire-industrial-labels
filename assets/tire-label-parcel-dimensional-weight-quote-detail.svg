<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Compare two carton profiles</title><desc>Example calculation before carrier rounding</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Compare two carton profiles</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Example calculation before carrier rounding</text><text x="210.0" y="183" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">Carton A</text><rect x="75" y="225" width="270" height="175" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="210.0" y="278" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">50 × 40 × 30 cm</text><text x="210.0" y="329" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">9 kg actual</text><text x="210.0" y="467" fill="#17685d" font-size="29" text-anchor="middle" font-weight="600">12 kg dimensional</text><text x="584.5" y="183" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">Carton B</text><rect x="463" y="225" width="243" height="145" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="584.5" y="278" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">45 × 40 × 25 cm</text><text x="584.5" y="329" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">9 kg actual</text><text x="584.5" y="467" fill="#17685d" font-size="29" text-anchor="middle" font-weight="600">9 kg dimensional</text><text x="400" y="530" fill="#162c42" font-size="26" text-anchor="middle" font-weight="600">Fictional inputs and a 5,000 cm³/kg divisor</text><line