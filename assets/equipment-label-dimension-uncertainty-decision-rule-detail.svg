<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Define what is being measured</title><desc>Flexible label concept; no actual reading</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Define what is being measured</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Flexible label concept; no actual reading</text><rect x="93" y="257" width="614" height="152" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><rect x="164" y="287" width="472" height="85" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><line x1="164" y1="224" x2="164" y2="417" stroke="#17685d" stroke-width="3" stroke-dasharray="9 8"/><line x1="636" y1="224" x2="636" y2="417" stroke="#17685d" stroke-width="3" stroke-dasharray="9 8"/><line x1="164" y1="217" x2="636" y2="217" stroke="#234c69" stroke-width="3"/><line x1="164" y1="204" x2="164" y2="230" stroke="#234c69" stroke-width="3"/><line x1="636" y1="204" x2="636" y2="230" stroke="#234c69" stroke-width="3"/><text x="400.0" y="203" fill="#162c42" font-size="26" text-anchor="middle" font-weight="600">Which finished edges?</text><text x="400" y="456" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">On liner or removed? Conditioned how?</text><text x="400" y="512" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">Feature • state • method • units</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>