<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680"><rect width="800" height="680" fill="#eff4f4"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="800" height="14" rx="10" fill="#e86a30"/><text x="36" y="65" font-size="30" fill="#17384b" font-weight="bold">FOUR MILESTONES BEFORE USE</text><rect x="30" y="105" width="740" height="105" rx="10" fill="white"/><text x="48" y="145" font-size="28" fill="#17384b" font-weight="bold">01 APPROVALS</text><text x="48" y="185" font-size="25" fill="#17384b" font-weight="normal">Artwork, data and required evaluation</text><rect x="30" y="240" width="740" height="105" rx="10" fill="white"/><text x="48" y="280" font-size="28" fill="#17384b" font-weight="bold">02 PRODUCTION + PACKING</text><text x="48" y="320" font-size="25" fill="#17384b" font-weight="normal">Supplier-confirmed completion milestone</text><rect x="30" y="375" width="740" height="105" rx="10" fill="white"/><text x="48" y="415" font-size="28" fill="#17384b" font-weight="bold">03 TRANSPORT</text><text x="48" y="455" font-size="25" fill="#17384b" font-weight="normal">Assessed route and dispatch conditions</text><rect x="30" y="510" width="740" height="105" rx="10" fill="white"/><text x="48" y="550" font-size="28" fill="#17384b" font-weight="bold">04 RECEIPT + RELEASE</text><text x="48" y="590" font-size="25" fill="#17384b" font-weight="normal">Ready for the actual tire-packing shift</text><text x="36" y="640" font-size="24" fill="#17384b" font-weight="normal">Illustrative planning aid; agree order-specific terms.</text></g></svg>