<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>The overlap creates a second interface</title><desc>Conceptual section; not to scale or a released stack</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">The overlap creates a second interface</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Conceptual section; not to scale or a released stack</text><rect x="440" y="244" width="280" height="46" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="440" y="290" width="280" height="22" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><rect x="80" y="312" width="640" height="46" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="80" y="358" width="640" height="22" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><rect x="80" y="380" width="640" height="74" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><text x="94" y="209" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">Main label</text><line x1="192" y1="225" x2="192" y2="304" stroke="#17685d" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="209" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">Trailing end</text><text x="112" y="346" fill="#162c42" font-size="25" text-anchor="start" font-weight="600">PRINTED / FINISHED FACE</text><text x="235" y="430" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">ACTUAL CONTAINER</text><line x1="743" y1="300" x2="743" y2="365" stroke="#994620" stroke-width="4"/><line x1="730" y1="312" x2="755" y2="312" stroke="#994620" stroke-width="4"/><text x="400" y="512" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Container bond and overlap bond are distinct.</text><text x="400" y="550" fill="#162c42" font-size="26" text-anchor="middle" font-weight="600">The trailing adhesive lands on the earlier face.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>