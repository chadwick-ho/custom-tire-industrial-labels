<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Retain the same specimen at each stage</title><desc>Proposed witness, not a passed durability test</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Retain the same specimen at each stage</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Proposed witness, not a passed durability test</text><line x1="104" y1="260" x2="700" y2="260" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><circle cx="138" cy="260" r="13" fill="#cbece1" stroke="#234c69" stroke-width="3"/><circle cx="400" cy="260" r="13" fill="#cbece1" stroke="#234c69" stroke-width="3"/><circle cx="661" cy="260" r="13" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="138" y="322" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">Initial</text><text x="400" y="322" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">Movement</text><text x="661" y="322" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">Recovery</text><text x="109" y="403" fill="#162c42" font-size="32" text-anchor="start" font-weight="600">Attachment / edge observations</text><text x="109" y="463" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">Required text and code observations</text><text x="400" y="536" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Record the actual reading condition and limits.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-we