<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680"><rect width="800" height="680" fill="#eff4f4"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="800" height="14" rx="10" fill="#e86a30"/><text x="36" y="65" font-size="30" fill="#17384b" font-weight="bold">A PER-SKU QUANTITY AGREEMENT</text><rect x="30" y="105" width="740" height="95" rx="10" fill="white"/><text x="48" y="135" font-size="28" fill="#17384b" font-weight="bold">SKU + approved revision</text><text x="48" y="175" font-size="26" fill="#17384b" font-weight="normal">Which label does this row cover?</text><rect x="30" y="220" width="740" height="95" rx="10" fill="white"/><text x="48" y="250" font-size="28" fill="#17384b" font-weight="bold">Required + agreed limits</text><text x="48" y="290" font-size="26" fill="#17384b" font-weight="normal">What count can the buyer accept?</text><rect x="30" y="335" width="740" height="95" rx="10" fill="white"/><text x="48" y="365" font-size="28" fill="#17384b" font-weight="bold">Count + invoice basis</text><text x="48" y="405" font-size="26" fill="#17384b" font-weight="normal">How are delivered pieces reconciled?</text><rect x="30" y="450" width="740" height="95" rx="10" fill="white"/><text x="48" y="480" font-size="28" fill="#17384b" font-weight="bold">Exception owner + action</text><text x="48" y="520" font-size="26" fill="#17384b" font-weight="normal">Who resolves an out-of-range count?</text><text x="36" y="640" font-size="24" fill="#17384b" font-weight="normal">Illustrative planning aid; agree order-specific terms.</text></g></svg>