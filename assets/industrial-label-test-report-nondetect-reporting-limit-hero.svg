<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>A less-than result has a boundary</title><desc>Fictional mg/kg example; no regulatory limit</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">A less-than result has a boundary</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Fictional mg/kg example; no regulatory limit</text><rect x="100" y="266" width="512" height="100" rx="0" fill="#cde8f4" stroke="#ffffff" stroke-width="3"/><line x1="100" y1="387" x2="714" y2="387" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><line x1="356" y1="228" x2="356" y2="262" stroke="#994620" stroke-width="4" stroke-dasharray="9 8"/><line x1="356" y1="369" x2="356" y2="418" stroke="#994620" stroke-width="4" stroke-dasharray="9 8"/><line x1="612" y1="246" x2="612" y2="418" stroke="#17685d" stroke-width="4"/><text x="100" y="460" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">0</text><text x="356" y="460" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">50</text><text x="612" y="460" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">100</text><text x="356" y="198" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">Buyer threshold</text><text x="438" y="320" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">Reported: &lt;100</text><text x="400" y="519" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Below 100 does not establish at or below 50.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>