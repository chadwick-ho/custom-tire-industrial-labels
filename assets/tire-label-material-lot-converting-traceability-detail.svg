<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Do not confuse two lot fields</title><desc>Conceptual identifiers; no actual buyer data</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Do not confuse two lot fields</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Conceptual identifiers; no actual buyer data</text><rect x="70" y="181" width="660" height="143" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="95" y="226" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">Label material / conversion lot</text><text x="95" y="280" fill="#162c42" font-size="29" text-anchor="start" font-weight="600">Supplier record → delivered roll</text><rect x="70" y="353" width="660" height="143" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><text x="95" y="398" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">Tire batch printed on the label</text><text x="95" y="452" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">Customer product data → tire record</text><text x="400" y="546" fill="#162c42" font-size="26" text-anchor="middle" font-weight="600">One field does not automatically establish the other.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>