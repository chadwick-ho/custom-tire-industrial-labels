<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Keep two observations</title><desc>Illustrative comparison of incoming rolls</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Keep two observations</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Illustrative comparison of incoming rolls</text><rect x="64" y="187" width="294" height="87" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="211.0" y="239.5" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">Approved liner</text><rect x="442" y="187" width="294" height="87" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="589.0" y="239.5" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">Proposed liner</text><line x1="210" y1="285" x2="210" y2="363" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><line x1="589" y1="285" x2="589" y2="363" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><rect x="67" y="376" width="668" height="110" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="400" y="423" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">Dispensing and later attachment</text><text x="400" y="457" fill="#162c42" font-size="25" text-anchor="middle" font-weight="600">Record each on its own basis.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>