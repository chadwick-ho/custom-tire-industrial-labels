<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Keep the last digit as well as the first</title><desc>Fictional text IDs; not GS1 production identifiers</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Keep the last digit as well as the first</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Fictional text IDs; not GS1 production identifiers</text><rect x="67" y="185" width="666" height="89" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="400.0" y="239.5" fill="#162c42" font-size="46" text-anchor="middle" font-weight="600">1234567890123456</text><rect x="67" y="319" width="666" height="89" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="400.0" y="373.5" fill="#162c42" font-size="46" text-anchor="middle" font-weight="600">1234567890123457</text><rect x="573" y="193" width="44" height="70" rx="8" fill="none" stroke="#994620" stroke-width="3"/><rect x="573" y="327" width="44" height="70" rx="8" fill="none" stroke="#994620" stroke-width="3"/><text x="400" y="488" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">These are distinct strings in the approved source.</text><text x="400" y="541" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">Witness the suffix after every data handoff.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>