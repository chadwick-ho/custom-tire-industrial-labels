<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Ask for different evidence</title><desc>Approve both functions if the process needs them</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Ask for different evidence</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Approve both functions if the process needs them</text><rect x="52" y="210" width="324" height="223" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="424" y="210" width="324" height="223" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><text x="214" y="266" fill="#162c42" font-size="33" text-anchor="middle" font-weight="600">Durable ID</text><text x="214" y="326" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">Legible after use</text><text x="586" y="266" fill="#162c42" font-size="33" text-anchor="middle" font-weight="600">Heat witness</text><text x="586" y="326" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">Approved threshold</text><text x="586" y="376" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">and placement</text><text x="399" y="527" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Record the observed state against the right ID.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>