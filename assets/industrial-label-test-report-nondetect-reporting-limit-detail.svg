<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Keep the result with its legend</title><desc>Conceptual fields, not a laboratory report</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Keep the result with its legend</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Conceptual fields, not a laboratory report</text><rect x="101" y="170" width="598" height="364" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="128" y="220" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">Sample / material basis</text><text x="128" y="278" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">Analyte and method</text><text x="128" y="336" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">Result: ND</text><path d="M 328 327 L 598 327 L 598 370" fill="none" stroke="#994620" stroke-width="4"/><rect x="128" y="386" width="544" height="109" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="151" y="428" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">Meaning? Limit? Units?</text><text x="151" y="472" fill="#162c42" font-size="29" text-anchor="start" font-weight="600">Ask the report issuer.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>