<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Proof the item lookup</title><desc>Compare the compact print with the full record</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Proof the item lookup</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Compare the compact print with the full record</text><rect x="51" y="224" width="255" height="164" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><text x="179" y="291" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">Compact</text><text x="179" y="341" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">symbol</text><line x1="318" y1="303" x2="458" y2="303" stroke="#234c69" stroke-width="5" marker-end="url(#arrow)"/><rect x="467" y="224" width="281" height="164" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="608" y="291" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">Approved</text><text x="608" y="341" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">item record</text><text x="400" y="503" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">Check the actual scanner and host result.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>