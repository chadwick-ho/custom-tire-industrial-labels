<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650"><rect width="800" height="650" fill="#edf3f4"/><rect width="800" height="12" fill="#dd743e"/><g font-family="Arial,sans-serif"><text x="30" y="60" fill="#15394a" font-size="29" font-weight="bold">MAKE THE ASSUMPTIONS VISIBLE</text><text x="40" y="140" fill="#15394a" font-size="28" font-weight="bold">FICTIONAL PLANNING VALUES</text><rect x="40" y="185" width="720" height="85" rx="6" fill="#fff"/><text x="65" y="240" fill="#15394a" font-size="28" font-weight="bold">4,000 labels × assumed 53 mm = 212 m</text><text x="40" y="340" fill="#15394a" font-size="29" font-weight="normal">+ agreed example allowance: 8 m</text><path d="M40 375 L760 375" fill="none" stroke="#247d7b" stroke-width="4"/><text x="40" y="450" fill="#15394a" font-size="32" font-weight="bold">= 220 m estimated demand</text><text x="40" y="530" fill="#15394a" font-size="25" font-weight="normal">Compare with identified compatible usable supply.</text><text x="30" y="616" fill="#15394a" font-size="23" font-weight="normal">Invented inputs; not measured consumption or a device limit.</text></g></svg>