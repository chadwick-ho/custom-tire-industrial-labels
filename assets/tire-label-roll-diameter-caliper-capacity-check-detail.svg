<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Estimate length, then positions</title><desc>Fictional uniform-web arithmetic only</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Estimate length, then positions</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Fictional uniform-web arithmetic only</text><rect x="72" y="181" width="656" height="81" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="400.0" y="231.5" fill="#162c42" font-size="36" text-anchor="middle" font-weight="600">L = π(D² − d²) / (4t)</text><text x="400" y="307" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">D = 150 mm   d = 80 mm   t = 0.20 mm</text><line x1="400" y1="324" x2="400" y2="361" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><rect x="124" y="376" width="552" height="68" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="400.0" y="420.0" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">About 63.2 m of ideal web</text><text x="400" y="494" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">100 mm pitch → about 632 positions</text><text x="400" y="538" fill="#162c42" font-size="26" text-anchor="middle" font-weight="600">Confirm actual diameter and supplied count.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>