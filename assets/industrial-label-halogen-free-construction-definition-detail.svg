<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Define the halogen requirement</title><desc>A supplier heading is not the definition</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Define the halogen requirement</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">A supplier heading is not the definition</text><rect x="73" y="173" width="654" height="77" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="400.0" y="221.5" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">Customer specification + revision</text><line x1="400" y1="263" x2="400" y2="304" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><rect x="113" y="319" width="574" height="122" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="400" y="363" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">Substances • limits • basis</text><text x="400" y="411" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">Complete construction evidence</text><text x="400" y="498" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">“RoHS” and “halogen-free”</text><text x="400" y="538" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">need their own stated assessment scope.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>