<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650"><rect width="800" height="650" fill="#eef3f4"/><rect width="800" height="12" fill="#dd7138"/><g font-family="Arial, sans-serif"><text x="30" y="62" fill="#15394a" font-size="29" font-weight="bold">A PROFILE IS AN OBSERVATION</text><text x="35" y="130" fill="#15394a" font-size="25" font-weight="bold">EVEN EDGE CONCEPT</text><text x="425" y="130" fill="#15394a" font-size="25" font-weight="bold">DISPLACED LAYERS</text><rect x="80" y="180" width="235" height="23" rx="7" fill="#267d7b"/><rect x="420" y="180" width="235" height="23" rx="7" fill="#cb835d"/><rect x="80" y="205" width="235" height="23" rx="7" fill="#267d7b"/><rect x="436" y="205" width="235" height="23" rx="7" fill="#cb835d"/><rect x="80" y="230" width="235" height="23" rx="7" fill="#267d7b"/><rect x="452" y="230" width="235" height="23" rx="7" fill="#cb835d"/><rect x="80" y="255" width="235" height="23" rx="7" fill="#267d7b"/><rect x="468" y="255" width="235" height="23" rx="7" fill="#cb835d"/><rect x="80" y="280" width="235" height="23" rx="7" fill="#267d7b"/><rect x="484" y="280" width="235" height="23" rx="7" fill="#cb835d"/><rect x="80" y="305" width="235" height="23" rx="7" fill="#267d7b"/><rect x="500" y="305" width="235" height="23" rx="7" fill="#cb835d"/><rect x="80" y="330" width="235" height="23" rx="7" fill="#267d7b"/><rect x="516" y="330" width="235" height="23" rx="7" fill="#cb835d"/><text x="35" y="445" fill="#15394a" font-size="26" font-weight="normal">Preserve the supplied geometry and roll identity.</text><text x="35" y="495" fill="#15394a" font-size="26" font-weight="normal">Do not infer the cause from the profile alone.</text><text x="35" y="545" fill="#15394a" font-size="26" font-weight="normal">No acceptance limit is represented.</text><text x="30" y="614" fill="#15394a" font-size="24" font-weight="normal">Schematic only; confirm the project specification.</text></g></svg>