<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650"><rect width="800" height="650" fill="#edf3f4"/><rect width="800" height="12" fill="#dd743e"/><g font-family="Arial,sans-serif"><text x="30" y="60" fill="#15394a" font-size="29" font-weight="bold">KEEP TWO UNAPPLIED RECORDS SEPARATE</text><text x="40" y="135" fill="#15394a" font-size="28" font-weight="bold">ON LINER</text><path d="M45 270 Q190 175 350 270" fill="none" stroke="#b1cbd0" stroke-width="20"/><path d="M75 240 Q190 185 320 240" fill="none" stroke="#cf7545" stroke-width="12"/><text x="440" y="135" fill="#15394a" font-size="27" font-weight="bold">RELEASED LABEL</text><path d="M465 260 Q600 130 735 260" fill="none" stroke="#cf7545" stroke-width="12"/><rect x="40" y="375" width="720" height="135" rx="6" fill="#fff"/><text x="65" y="425" fill="#15394a" font-size="26" font-weight="normal">Retain identity, state and examination history.</text><text x="65" y="470" fill="#15394a" font-size="26" font-weight="normal">Do not infer a cause or a universal curl limit.</text><text x="30" y="616" fill="#15394a" font-size="23" font-weight="normal">Original schematic; no actual test, order or approval.</text></g></svg>