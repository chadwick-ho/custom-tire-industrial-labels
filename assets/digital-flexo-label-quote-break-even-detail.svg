<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650"><rect width="800" height="650" fill="#edf3f4"/><rect width="800" height="12" fill="#dd743e"/><g font-family="Arial,sans-serif"><text x="30" y="60" fill="#15394a" font-size="29" font-weight="bold">DO NOT REPLACE THE SKU MIX WITH A TOTAL</text><text x="40" y="135" fill="#15394a" font-size="27" font-weight="bold">ONE RELEASED VERSION</text><rect x="40" y="170" width="720" height="80" rx="6" fill="#fff"/><text x="65" y="220" fill="#15394a" font-size="27" font-weight="normal">Quantity and setup scope confirmed together</text><text x="40" y="335" fill="#15394a" font-size="27" font-weight="bold">SEVERAL VERSION RELEASES</text><rect x="40" y="375" width="225" height="100" rx="6" fill="#b1cbd0"/><text x="60" y="435" fill="#15394a" font-size="28" font-weight="bold">SKU A</text><rect x="285" y="375" width="225" height="100" rx="6" fill="#b1cbd0"/><text x="305" y="435" fill="#15394a" font-size="28" font-weight="bold">SKU B</text><rect x="530" y="375" width="225" height="100" rx="6" fill="#b1cbd0"/><text x="550" y="435" fill="#15394a" font-size="28" font-weight="bold">SKU C</text><text x="40" y="550" fill="#15394a" font-size="26" font-weight="normal">Ask which charges recur and which are shared.</text><text x="30" y="616" fill="#15394a" font-size="23" font-weight="normal">Original schematic; no actual test, order or approval.</text></g></svg>