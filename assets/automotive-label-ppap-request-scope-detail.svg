<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650"><rect width="800" height="650" fill="#edf3f4"/><rect width="800" height="12" fill="#dd743e"/><g font-family="Arial,sans-serif"><text x="30" y="60" fill="#15394a" font-size="29" font-weight="bold">DEFINE THE CUSTOMER-SPECIFIC HANDOFF</text><rect x="40" y="125" width="720" height="75" rx="6" fill="#fff"/><text x="65" y="172" fill="#15394a" font-size="29" font-weight="bold">Authorized customer requirement</text><path d="M400 210 L400 270" fill="none" stroke="#247d7b" stroke-width="4"/><polygon points="400,270 409.0,253.0 391.0,253.0" fill="#247d7b"/><rect x="40" y="285" width="330" height="120" rx="6" fill="#b1cbd0"/><rect x="430" y="285" width="330" height="120" rx="6" fill="#fff"/><text x="65" y="330" fill="#15394a" font-size="26" font-weight="normal">Requested evidence</text><text x="65" y="370" fill="#15394a" font-size="25" font-weight="normal">and its actual scope</text><text x="455" y="330" fill="#15394a" font-size="27" font-weight="normal">Named owners</text><text x="455" y="370" fill="#15394a" font-size="25" font-weight="normal">and prerequisites</text><path d="M400 415 L400 465" fill="none" stroke="#247d7b" stroke-width="4"/><polygon points="400,465 409.0,448.0 391.0,448.0" fill="#247d7b"/><text x="95" y="520" fill="#15394a" font-size="26" font-weight="bold">Explicit review and subsequent release decision</text><text x="30" y="616" fill="#15394a" font-size="23" font-weight="normal">Editorial fields; not a PPAP checklist, warrant or approval.</text></g></svg>