<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Define the reported endpoint</title><desc>Illustrative result types, no test values</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Define the reported endpoint</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Illustrative result types, no test values</text><rect x="70" y="178" width="660" height="119" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="95" y="224" fill="#162c42" font-size="32" text-anchor="start" font-weight="600">Fixed cycles → observation</text><text x="95" y="272" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">Mass loss or stated appearance result</text><rect x="70" y="333" width="660" height="119" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="95" y="379" fill="#162c42" font-size="32" text-anchor="start" font-weight="600">Specified endpoint → cycles</text><text x="95" y="427" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">State exactly what change ends the test</text><text x="400" y="527" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Compare wheel, load, specimen and criteria too.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>