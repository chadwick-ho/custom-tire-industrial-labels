<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Check access after installation</title><desc>A nearby lip can block an otherwise useful tab</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Check access after installation</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">A nearby lip can block an otherwise useful tab</text><text x="197" y="193" fill="#17685d" font-size="30" text-anchor="middle" font-weight="600">Accessible</text><text x="591" y="193" fill="#994620" font-size="30" text-anchor="middle" font-weight="600">Blocked</text><rect x="42" y="390" width="332" height="72" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><rect x="65" y="338" width="218" height="51" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><rect x="283" y="338" width="72" height="51" rx="8" fill="#f9e1d3" stroke="#994620" stroke-width="3"/><line x1="318" y1="275" x2="318" y2="333" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><text x="250" y="253" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">Grip from above</text><rect x="425" y="390" width="333" height="72" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><rect x="450" y="338" width="194" height="51" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><rect x="644" y="338" width="72" height="51" rx="8" fill="#f9e1d3" stroke="#994620" stroke-width="3"/><path d="M634 314 V265 H741 V390 H714 V314 Z" fill="#d9e1e6" stroke="#234c69" stroke-width="4"/><text x="667" y="244" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Panel lip</