<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Compare the agreed operating states</title><desc>Conceptual trial record; no measured outcomes</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Compare the agreed operating states</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Conceptual trial record; no measured outcomes</text><text x="95" y="213" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">State</text><text x="335" y="213" fill="#162c42" font-size="30" text-anchor="start" font-weight="600">Keep with the result</text><rect x="70" y="236" width="660" height="93" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><rect x="70" y="346" width="660" height="93" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="95" y="292" fill="#162c42" font-size="29" text-anchor="start" font-weight="600">Stationary</text><text x="335" y="274" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">Reference capture</text><text x="335" y="308" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">and decoded value</text><text x="95" y="400" fill="#162c42" font-size="29" text-anchor="start" font-weight="600">Moving</text><text x="335" y="383" fill="#162c42" font-size="27" text-anchor="start" font-weight="600">Speed and presentation</text><text x="335" y="418" fill="#162c42" font-size="27" text-anchor="start" font-weight="600">with observed outcomes</text><text x="400" y="502" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">Retain the same released label reference.</text