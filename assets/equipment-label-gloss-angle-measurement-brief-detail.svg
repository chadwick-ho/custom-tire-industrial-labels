<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Mark the region before measuring</title><desc>Illustrative mixed-finish label, not readings</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Mark the region before measuring</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Illustrative mixed-finish label, not readings</text><rect x="106" y="183" width="588" height="257" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="456" y="213" width="203" height="83" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="557.5" y="264.5" fill="#162c42" font-size="37" text-anchor="middle" font-weight="600">LOGO</text><text x="135" y="243" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">MATTE</text><text x="135" y="285" fill="#162c42" font-size="28" text-anchor="start" font-weight="600">BACKGROUND</text><circle cx="174" cy="342" r="14" fill="#cbece1" stroke="#234c69" stroke-width="3"/><circle cx="347" cy="342" r="14" fill="#cbece1" stroke="#234c69" stroke-width="3"/><circle cx="586" cy="383" r="14" fill="#cbece1" stroke="#234c69" stroke-width="3"/><circle cx="553" cy="284" r="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><text x="400" y="495" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">Keep different finish regions identifiable.</text><text x="400" y="540" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Check that the instrument footprint fits.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>