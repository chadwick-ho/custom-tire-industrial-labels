<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Witness the pale region in print</title><desc>Conceptual tint ramp; no universal percentages</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Witness the pale region in print</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Conceptual tint ramp; no universal percentages</text><rect x="77" y="207" width="113" height="162" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><rect x="205" y="207" width="113" height="162" rx="8" fill="#eef7fb" stroke="#234c69" stroke-width="3"/><rect x="333" y="207" width="113" height="162" rx="8" fill="#d8edf7" stroke="#234c69" stroke-width="3"/><rect x="461" y="207" width="113" height="162" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="589" y="207" width="113" height="162" rx="8" fill="#90bcd1" stroke="#234c69" stroke-width="3"/><line x1="338" y1="181" x2="338" y2="416" stroke="#994620" stroke-width="4" stroke-dasharray="9 8"/><text x="80" y="457" fill="#162c42" font-size="29" text-anchor="start" font-weight="600">Converter-specific reproduction boundary</text><text x="400" y="516" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">A screen tint is not the finished appearance.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>