<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Reconcile IDs at the boundary</title><desc>A local number alone does not establish uniqueness</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Reconcile IDs at the boundary</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">A local number alone does not establish uniqueness</text><rect x="72" y="180" width="656" height="277" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="98" y="231" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">Last allowed complete ID</text><line x1="98" y1="252" x2="700" y2="252" stroke="#d9e1e6" stroke-width="3"/><text x="98" y="306" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">Next observed output / event</text><line x1="98" y1="327" x2="700" y2="327" stroke="#d9e1e6" stroke-width="3"/><text x="98" y="395" fill="#162c42" font-size="29" text-anchor="start" font-weight="600">Issued and reserved record check</text><text x="400" y="522" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">Retain configuration, expectation and observation.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>