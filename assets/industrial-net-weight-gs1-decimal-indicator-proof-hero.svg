<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Approve AI and magnitude together</title><desc>Fictional fields only; not a complete GS1 symbol</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Approve AI and magnitude together</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Fictional fields only; not a complete GS1 symbol</text><rect x="182" y="174" width="436" height="80" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="400.0" y="224.0" fill="#162c42" font-size="34" text-anchor="middle" font-weight="600">APPROVED: 12.345 kg</text><line x1="400" y1="265" x2="400" y2="307" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><rect x="83" y="327" width="230" height="91" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="198.0" y="382.5" fill="#162c42" font-size="38" text-anchor="middle" font-weight="600">AI 3103</text><rect x="335" y="327" width="383" height="91" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="526.5" y="382.5" fill="#162c42" font-size="47" text-anchor="middle" font-weight="600">012345</text><text x="400" y="480" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">Three decimal places → 012.345 kg</text><text x="400" y="539" fill="#162c42" font-size="26" text-anchor="middle" font-weight="600">Complete identifiers and syntax need owner approval.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>