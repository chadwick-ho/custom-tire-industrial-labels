<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Check the posted transaction</title><desc>Both paths refer to the same trade item</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Check the posted transaction</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Both paths refer to the same trade item</text><rect x="58" y="199" width="256" height="62" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="186.0" y="240" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">Linear capture</text><rect x="58" y="364" width="256" height="62" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="186.0" y="405" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">2D capture</text><line x1="328" y1="233" x2="452" y2="296" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><line x1="328" y1="395" x2="452" y2="335" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><rect x="466" y="253" width="274" height="126" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><text x="603" y="304" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">One item</text><text x="603" y="345" fill="#162c42" font-size="31" text-anchor="middle" font-weight="600">One checkout</text><text x="400" y="529" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">Use the actual checkout and sample.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS