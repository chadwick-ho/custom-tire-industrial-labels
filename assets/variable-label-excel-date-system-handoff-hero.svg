<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>One calendar date, two serial systems</title><desc>Conceptual workbook handoff; no customer records</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">One calendar date, two serial systems</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Conceptual workbook handoff; no customer records</text><rect x="145" y="165" width="510" height="65" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="400.0" y="207.5" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">APPROVED CALENDAR DATE</text><line x1="122" y1="311" x2="692" y2="311" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><line x1="248" y1="425" x2="692" y2="425" stroke="#994620" stroke-width="4" marker-end="url(#arrow)"/><line x1="657" y1="270" x2="657" y2="456" stroke="#234c69" stroke-width="3" stroke-dasharray="9 8"/><text x="96" y="283" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">1900 system</text><text x="96" y="396" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">1904 system</text><text x="400" y="502" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">Same-date serials differ by 1,462 days.</text><text x="400" y="545" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">A bare serial needs its interpretation.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>