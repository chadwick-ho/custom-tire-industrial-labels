<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>From URL to printed QR</title><desc>Compare the source and decoded value</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">From URL to printed QR</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Compare the source and decoded value</text><rect x="48" y="179" width="704" height="62" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="400.0" y="220" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">1   Released URL   /asset/A%2FB</text><line x1="400" y1="244" x2="400" y2="275" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="278" width="704" height="62" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="400.0" y="319" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">2   Import and generate</text><line x1="400" y1="342" x2="400" y2="373" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="376" width="704" height="62" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="400.0" y="417" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">3   Decode finished sample</text><line x1="400" y1="440" x2="400" y2="471" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="474" width="704" height="62" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="400.0" y="515" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">4   Confirm the record separately</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d