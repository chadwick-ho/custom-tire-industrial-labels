<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Compute effective resolution</title><desc>Illustrative values; no acceptance threshold</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Compute effective resolution</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Illustrative values; no acceptance threshold</text><rect x="44" y="182" width="712" height="62" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><text x="400.0" y="223" fill="#162c42" font-size="34" text-anchor="middle" font-weight="600">Source width: 600 pixels</text><rect x="44" y="291" width="712" height="62" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><text x="400.0" y="332" fill="#162c42" font-size="36" text-anchor="middle" font-weight="600">600 px ÷ 2 in = 300 PPI</text><rect x="44" y="396" width="712" height="62" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="400.0" y="437" fill="#162c42" font-size="36" text-anchor="middle" font-weight="600">600 px ÷ 4 in = 150 PPI</text><text x="400" y="522" fill="#162c42" font-size="30" text-anchor="middle" font-weight="600">Repeat the check for the other axis.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>