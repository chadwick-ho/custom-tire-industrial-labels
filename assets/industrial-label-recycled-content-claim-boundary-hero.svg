<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Which component has the evidence?</title><desc>Construction concept; no recycled content declared</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Which component has the evidence?</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Construction concept; no recycled content declared</text><rect x="79" y="240" width="348" height="16" rx="8" fill="#234c69" stroke="#234c69" stroke-width="3"/><rect x="79" y="266" width="348" height="48" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="79" y="324" width="348" height="30" rx="8" fill="#f9e1d3" stroke="#234c69" stroke-width="3"/><rect x="79" y="364" width="348" height="44" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><text x="80" y="204" fill="#162c42" font-size="25" text-anchor="start" font-weight="600">PRINT / FACE / ADHESIVE / LINER</text><rect x="512" y="229" width="225" height="170" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="624" y="279" fill="#162c42" font-size="32" text-anchor="middle" font-weight="600">FACE</text><text x="624" y="321" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">DOCUMENT</text><line x1="500" y1="290" x2="440" y2="290" stroke="#17685d" stroke-width="4" marker-end="url(#arrow)"/><text x="400" y="464" fill="#162c42" font-size="29" text-anchor="middle" font-weight="600">A face statement does not cover every layer.</text><text x="400" y="521" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Retain grade, content type, basis and scope.</