<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>A flat picture is not a tactile device</title><desc>Cross-section concepts; not compliant device geometry</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">A flat picture is not a tactile device</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Cross-section concepts; not compliant device geometry</text><text x="90" y="180" fill="#162c42" font-size="32" text-anchor="start" font-weight="600">Printed graphic</text><rect x="88" y="243" width="626" height="43" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><rect x="250" y="231" width="289" height="12" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="90" y="367" fill="#162c42" font-size="32" text-anchor="start" font-weight="600">Physical raised feature</text><rect x="88" y="455" width="626" height="43" rx="8" fill="#d9e1e6" stroke="#234c69" stroke-width="3"/><path d="M 245 454 L 277 454 L 277 417 Q 401 391 525 417 L 525 454 L 557 454" fill="#cbece1" stroke="#17685d" stroke-width="4"/><text x="400" y="546" fill="#162c42" font-size="27" text-anchor="middle" font-weight="600">The owner must approve the actual required device.</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>