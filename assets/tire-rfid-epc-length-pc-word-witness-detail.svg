<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Count words before the witness</title><desc>Arithmetic examples, not tag specifications</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Count words before the witness</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Arithmetic examples, not tag specifications</text><text x="75" y="195" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">Six 16-bit words</text><rect x="75" y="220" width="64" height="56" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="147" y="220" width="64" height="56" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="219" y="220" width="64" height="56" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="291" y="220" width="64" height="56" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="363" y="220" width="64" height="56" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><rect x="435" y="220" width="64" height="56" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="75" y="321" fill="#162c42" font-size="29" text-anchor="start" font-weight="600">96 bits = 24 hexadecimal characters</text><text x="75" y="391" fill="#162c42" font-size="31" text-anchor="start" font-weight="600">Eight 16-bit words</text><rect x="75" y="415" width="64" height="56" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><rect x="147" y="415" width="64" height="56" rx="8" fill="#cbece1" stroke="#234c69" stroke-width="3"/><rect x="219" y="415" width="64" height="56" rx="8" fill="#cbece1" stroke="#2