<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Map the scan result</title><desc>Resolve the record the receiver needs</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#234c69"/></marker></defs><rect width="800" height="620" fill="#f6fafb"/><rect width="800" height="130" fill="#142c43"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="56" fill="#ffffff" font-size="38" text-anchor="start" font-weight="600">Map the scan result</text><text x="35" y="99" fill="#d8eaf3" font-size="26" text-anchor="start" font-weight="500">Resolve the record the receiver needs</text><rect x="66" y="180" width="269" height="83" rx="8" fill="#cde8f4" stroke="#234c69" stroke-width="3"/><text x="200" y="231" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Asset record</text><line x1="335" y1="222" x2="461" y2="222" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)"/><rect x="477" y="180" width="249" height="83" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="600" y="231" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">One machine</text><rect x="66" y="351" width="269" height="83" rx="8" fill="#cbece1" stroke="#17685d" stroke-width="3"/><text x="200" y="402" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Returnable type</text><line x1="335" y1="392" x2="461" y2="392" stroke="#234c69" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="9 8"/><rect x="477" y="351" width="249" height="83" rx="8" fill="#ffffff" stroke="#234c69" stroke-width="3"/><text x="600" y="402" fill="#162c42" font-size="28" text-anchor="middle" font-weight="600">Optional instance</text><text x="400" y="520" fill="#17685d" font-size="26" text-anchor="middle" font-weight="600">Specify whether individual instances are needed</text><line x1="35" y1="561" x2="765" y2="561" stroke="#d9e1e6" stroke-width="2"/><text x="35" y="596" fill="#425b6e" font-size="20" text-anchor="start" font-weight="600">CYJ LABELS  /  ORIGINAL TECHNICAL DIAGRAM</text></g></svg>